name: Build EternityROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [d1xks]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/eternityrom_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/eternityrom_platform.x509.pem

      - name: Install samloader-rs
        env:
          SAMLOADER_VERSION: '2.1.0'
        run: |
          set -euo pipefail

          SAMLOADER_DIR="$GITHUB_WORKSPACE/out/tools/samloader-rs"
          SAMLOADER_ARCHIVE="$RUNNER_TEMP/samloader-v${SAMLOADER_VERSION}-linux-x86_64.zip"
          SAMLOADER_URL="https://github.com/topjohnwu/samloader-rs/releases/download/${SAMLOADER_VERSION}/samloader-v${SAMLOADER_VERSION}-linux-x86_64.zip"

          mkdir -p "$SAMLOADER_DIR"

          echo "Downloading samloader-rs ${SAMLOADER_VERSION}..."
          curl -fL --retry 5 --retry-delay 5 \
            "$SAMLOADER_URL" \
            -o "$SAMLOADER_ARCHIVE"

          echo "Extracting samloader-rs..."
          bsdtar -xf "$SAMLOADER_ARCHIVE" -C "$SAMLOADER_DIR"

          chmod +x "$SAMLOADER_DIR/samloader"

          echo "Installed samloader-rs:"
          "$SAMLOADER_DIR/samloader" --version

          if [ ! -x "$SAMLOADER_DIR/samloader" ]; then
            echo "::error::samloader-rs binary was not installed correctly."
            exit 1
          fi

          rm -f "$SAMLOADER_ARCHIVE"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-target

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-target

      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-source

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-source

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload ROM to GoFile
        run: |
          # Find the exact flashable ZIP generated by the build script
          ROM_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ROM_FILE" ]; then
            echo "Error: Flashable ZIP not found!"
            exit 1
          fi

          echo "Found ROM ZIP: $ROM_FILE"
          echo "Uploading to GoFile..."

          RESPONSE=$(curl -s -F "file=@$ROM_FILE" \
            -F "token=${{ secrets.GOFILE_TOKEN }}" \
            -F "folderId=${{ secrets.GOFILE_FOLDER }}" \
            "https://upload-eu-par.gofile.io/uploadFile")

          echo "Uploaded successfully! Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'
